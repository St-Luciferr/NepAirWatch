# NepAirWatch — Apache Flume agent "agent"
#
#   firms_fetcher.py ──files──► [spooldir source] ──replicating──► file channel ──► Kafka sink  (nepal.fires.raw)
#                                                              └─► mem channel  ──► HDFS sink   (/nepairwatch/raw/firms)
#
# Spooling-directory source: every new, immutable CSV file dropped into the spool dir is read line by
# line; each line becomes one Flume event. Files being written are named *.tmp and ignored.

agent.sources  = firms
agent.channels = toKafka toHdfs
agent.sinks    = kafka hdfs

# ---------------------------------------------------------------- source
agent.sources.firms.type = spooldir
agent.sources.firms.spoolDir = /appdata/spool/firms
agent.sources.firms.ignorePattern = ^.*\\.tmp$
agent.sources.firms.deletePolicy = immediate
agent.sources.firms.deserializer = LINE
agent.sources.firms.deserializer.maxLineLength = 4096
agent.sources.firms.batchSize = 500
agent.sources.firms.channels = toKafka toHdfs
agent.sources.firms.selector.type = replicating
agent.sources.firms.interceptors = ts
agent.sources.firms.interceptors.ts.type = timestamp

# ---------------------------------------------------------------- channels
# durable file channel in front of Kafka (survives agent restarts)
agent.channels.toKafka.type = file
agent.channels.toKafka.checkpointDir = /flume-data/kafka/checkpoint
agent.channels.toKafka.dataDirs = /flume-data/kafka/data
agent.channels.toKafka.capacity = 1000000
agent.channels.toKafka.transactionCapacity = 1000

agent.channels.toHdfs.type = memory
agent.channels.toHdfs.capacity = 200000
agent.channels.toHdfs.transactionCapacity = 1000

# ---------------------------------------------------------------- sinks
agent.sinks.kafka.type = org.apache.flume.sink.kafka.KafkaSink
agent.sinks.kafka.channel = toKafka
agent.sinks.kafka.kafka.bootstrap.servers = kafka:29092
agent.sinks.kafka.kafka.topic = nepal.fires.raw
agent.sinks.kafka.flumeBatchSize = 500
agent.sinks.kafka.kafka.producer.acks = all
agent.sinks.kafka.kafka.producer.linger.ms = 50
agent.sinks.kafka.kafka.producer.compression.type = lz4

agent.sinks.hdfs.type = hdfs
agent.sinks.hdfs.channel = toHdfs
agent.sinks.hdfs.hdfs.path = hdfs://namenode:9000/nepairwatch/raw/firms/dt=%Y-%m-%d
agent.sinks.hdfs.hdfs.filePrefix = fires
agent.sinks.hdfs.hdfs.fileSuffix = .csv
agent.sinks.hdfs.hdfs.inUsePrefix = _
agent.sinks.hdfs.hdfs.fileType = DataStream
agent.sinks.hdfs.hdfs.writeFormat = Text
agent.sinks.hdfs.hdfs.batchSize = 500
agent.sinks.hdfs.hdfs.rollInterval = 300
agent.sinks.hdfs.hdfs.rollSize = 0
agent.sinks.hdfs.hdfs.rollCount = 0
agent.sinks.hdfs.hdfs.idleTimeout = 120
agent.sinks.hdfs.hdfs.useLocalTimeStamp = true
