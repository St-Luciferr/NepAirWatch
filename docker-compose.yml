# NepAirWatch — the whole platform with one command:   docker compose up -d
#
#   kafka, kafka-ui, mongodb      infrastructure
#   kafka-init                    creates the topics (one-shot)
#   backfill                      loads 1 year of history into Kafka on first start (one-shot)
#   producer-live                 polls the live APIs every 15 min → Kafka
#   spark-streaming               Spark Structured Streaming: Kafka → Parquet lake + MongoDB + alerts
#   spark-batch                   Spark batch analytics + MLlib forecast (after backfill, then every 6 h)
#   dashboard                     Streamlit on http://localhost:8501
#   replay  (profile "demo")      docker compose run --rm replay   → fast re-stream for live demos

x-app: &app
  build: .
  image: nepairwatch-app:latest
  dns: [8.8.8.8, 1.1.1.1]   # don't depend on the host's resolver
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:29092
    MONGO_URI: mongodb://mongodb:27017
    LAKE_PATH: /app/data/lake
    CHECKPOINT_PATH: /app/data/checkpoints
    BACKFILL_DAYS: ${BACKFILL_DAYS:-365}
  volumes:
    - app_data:/app/data

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: nepair-kafka
    user: "0:0"   # needed to write to the named volume
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nepair-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: nepairwatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: nepair-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: nepair-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in nepal.air.raw nepal.air.alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  backfill:
    <<: *app
    container_name: nepair-backfill
    command: ["docker/backfill.sh"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  producer-live:
    <<: *app
    container_name: nepair-producer-live
    command: ["python", "-u", "-m", "producer.aq_producer", "live", "--interval", "${LIVE_INTERVAL:-900}"]
    depends_on:
      backfill:
        condition: service_completed_successfully
    restart: unless-stopped

  spark-streaming:
    <<: *app
    container_name: nepair-spark-streaming
    command: ["python", "-u", "spark_jobs/stream_processor.py"]
    ports:
      - "4040:4040"   # Spark UI
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  spark-batch:
    <<: *app
    container_name: nepair-spark-batch
    command: ["docker/batch_loop.sh"]
    environment:
      <<: *app-env
      BATCH_INTERVAL: ${BATCH_INTERVAL:-21600}
    depends_on:
      spark-streaming:
        condition: service_started
    restart: unless-stopped

  dashboard:
    <<: *app
    container_name: nepair-dashboard
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  replay:
    <<: *app
    container_name: nepair-replay
    profiles: ["demo"]
    command: ["python", "-u", "-m", "producer.aq_producer", "replay",
              "--days", "${REPLAY_DAYS:-2}", "--speed", "${REPLAY_SPEED:-2}"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

volumes:
  kafka_data:
  mongo_data:
  app_data:
